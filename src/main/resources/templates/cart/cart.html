<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/header :: head"></head>
<body>

<div th:replace="fragments/header :: body"></div>

<div class="container my-5 content">
    <a th:href="@{/catalog}" class="btn btn-cancel px-3 mb-4">← В каталог</a>

    <h3 class="fw-bold mb-4">Корзина</h3>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div th:if="${items.isEmpty()}" class="alert alert-secondary">
        Ваша корзина пуста. <a th:href="@{/catalog}">Перейти в каталог</a>.
    </div>

    <div th:unless="${items.isEmpty()}">
        <div class="table-responsive">
            <table class="table table-hover align-middle shadow-sm">
                <thead class="table-light">
                <tr>
                    <th>Товар</th>
                    <th class="text-center">Цена</th>
                    <th class="text-center">Количество</th>
                    <th class="text-end">Стоимость</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${items}">
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <img th:src="${item.image != null ? item.image : '/no-photo.jpg'}"
                                 th:classappend="${!item.inStock} ? 'out-of-stock'"
                                 style="width:50px;height:50px;object-fit:contain;" alt="Фото">
                            <div>
                                <a th:href="@{/catalog/medication/{id}(id=${item.medicationId})}"
                                   th:text="${item.name}" class="text-decoration-none text-dark fw-semibold"></a>
                                <div>
                                    <span th:if="${item.inStock}" class="text-success small">В наличии: [[${item.availableQuantity}]] шт</span>
                                    <span th:unless="${item.inStock}" class="text-danger small">Нет в наличии</span>
                                </div>
                            </div>
                        </div>
                    </td>
                    <td class="text-center" th:text="${#numbers.formatDecimal(item.price, 1, 2)}"></td>
                    <td class="text-center">
                        <form th:action="@{/cart/update/{id}(id=${item.medicationId})}" method="post" class="mb-0">
                            <input type="number" name="quantity" th:value="${item.quantity}" min="1"
                                   th:attr="max=${item.availableQuantity}" style="width:70px;"
                                   class="form-control form-control-sm"
                                   onkeydown="if(event.key==='Enter'){this.form.submit();return false;}"
                                   title="Введите количество и нажмите Enter">
                        </form>
                    </td>
                    <td class="text-end fw-semibold"
                        th:text="${#numbers.formatDecimal(item.lineTotal, 1, 2)}"></td>
                    <td class="text-end">
                        <form th:action="@{/cart/remove/{id}(id=${item.medicationId})}" method="post" class="mb-0">
                            <button type="submit" class="btn btn-sm btn-delete">Удалить</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-4">
            <h5 class="mb-0">Итого: <span th:text="${#numbers.formatDecimal(cartTotal, 1, 2)}"></span> ₽</h5>
            <a sec:authorize="!hasRole('CUSTOMER')" th:href="@{/login}" class="btn btn-save px-4">Войти для оформления</a>
            <a sec:authorize="hasRole('CUSTOMER')" th:href="@{/cart/checkout}" class="btn btn-save px-4">Оформить заказ</a>
        </div>
    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
