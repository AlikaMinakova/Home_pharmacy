<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/header :: head"></head>
<body>

<div th:replace="fragments/header :: body"></div>

<div class="container my-5 content">
    <a th:href="@{/catalog}" class="btn btn-cancel px-3 mb-4">← В каталог</a>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <h3 class="fw-bold mb-4">
        <span th:text="${medication.name}"></span>
        <span th:if="${medication.prescriptionRequired}" class="badge bg-danger">По рецепту</span>
    </h3>

    <div class="row">
        <div class="col-md-4 text-center">
            <div class="position-relative d-inline-block">
                <img th:src="${medication.image != null ? medication.image : '/no-photo.jpg'}"
                     th:classappend="${!inStock} ? 'out-of-stock'"
                     class="img-thumbnail" alt="Фото лекарства">
                <span th:if="${!inStock}" class="out-of-stock-overlay">Нет в наличии</span>
            </div>
        </div>

        <div class="col-md-6">
            <!-- Действия покупателя -->
            <div class="d-flex gap-2 flex-wrap mb-3" sec:authorize="!hasRole('EMPLOYEE')">
                <form sec:authorize="hasRole('CUSTOMER')" th:if="${inStock}"
                      th:action="@{/cart/add/{id}(id=${medication.id})}" method="post" class="mb-0">
                    <button type="submit" class="btn btn-save px-4">В корзину</button>
                </form>
                <a sec:authorize="!isAuthenticated()" th:if="${inStock}"
                   th:href="@{/login}" class="btn btn-save px-4">Войти и купить</a>
                <a th:unless="${inStock}"
                   th:href="@{/catalog/request}"
                   class="btn btn-cancel px-4">Оставить заявку на привоз</a>

                <!-- Кнопка избранного -->
                <form sec:authorize="hasRole('CUSTOMER')" th:unless="${isFavorite}"
                      th:action="@{/favorites/add/{id}(id=${medication.id})}" method="post" class="mb-0">
                    <button type="submit" class="btn btn-outline-danger px-4">
                        <i class="bi bi-heart"></i> В избранное
                    </button>
                </form>
                <form sec:authorize="hasRole('CUSTOMER')" th:if="${isFavorite}"
                      th:action="@{/favorites/remove/{id}(id=${medication.id})}" method="post" class="mb-0">
                    <button type="submit" class="btn btn-danger px-4">
                        <i class="bi bi-heart-fill"></i> В избранном
                    </button>
                </form>
            </div>

            <div class="card p-3 mb-4 shadow-sm">
                <h6 class="fw-bold">Основное</h6>
                <ul class="list-unstyled small">
                    <li th:text="'Описание: ' + ${medication.description}"></li>
                    <li th:text="'Цена: ' + ${#numbers.formatDecimal(medication.price, 1, 2)} + ' ₽'"></li>
                    <li th:if="${inStock}" th:text="'В наличии: ' + ${availableQuantity} + ' шт'"></li>
                    <li th:unless="${inStock}">В наличии: нет</li>
                    <li th:if="${medication.activeIngredients != null && !medication.activeIngredients.isEmpty()}">
                        <strong>Действующие вещества:</strong>
                        <span th:each="ingredient, iter : ${medication.activeIngredients}"
                              th:text="${ingredient.name + (iter.last ? '' : ', ')}"></span>
                    </li>
                    <li th:if="${medication.activeIngredients == null or medication.activeIngredients.isEmpty()}">
                        <strong>Действующие вещества:</strong> не указаны
                    </li>
                </ul>
            </div>

            <div class="card p-3 shadow-sm">
                <h6 class="fw-bold">От чего</h6>
                <table class="table table-sm">
                    <thead>
                    <tr>
                        <th>Болезни</th>
                        <th>Симптомы</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="disease : ${medication.diseases}">
                        <td th:text="${disease.name}"></td>
                        <td>
                            <span th:each="symptom, stat : ${disease.symptoms}"
                                  th:text="${symptom.name + (stat.last ? '' : ', ')}"></span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- График изменения цены -->
            <div class="card p-3 mt-4 shadow-sm" th:if="${priceHistory != null and !priceHistory.isEmpty()}">
                <h6 class="fw-bold">История изменения цены</h6>
                <canvas id="priceChart" width="600" height="200"
                        style="width:600px; height:200px; max-width:100%;"></canvas>
            </div>
        </div>
    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    (function () {
        var points = /*[[${priceHistory}]]*/ [];
        if (!points || points.length === 0) {
            return;
        }
        var labels = points.map(function (p) { return p.label; });
        var data = points.map(function (p) { return p.price; });
        var ctx = document.getElementById('priceChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Цена, ₽',
                    data: data,
                    borderColor: '#0b5ed7',
                    backgroundColor: 'rgba(11, 94, 215, 0.1)',
                    fill: true,
                    tension: 0.3,
                    pointRadius: 4
                }]
            },
            options: {
                responsive: false,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: {
                        beginAtZero: false,
                        ticks: { callback: function (value) { return value + ' ₽'; } }
                    }
                }
            }
        });
    })();
    /*]]>*/
</script>

</body>
</html>
