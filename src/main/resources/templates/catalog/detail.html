<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/header :: head"></head>
<body>

<div th:replace="fragments/header :: body"></div>

<div class="container my-5 content">
    <a th:href="@{/catalog}" class="btn btn-cancel px-3 mb-4">← Назад в каталог</a>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <div class="card shadow-sm">
        <div class="row g-0">
            <div class="col-md-4">
                <div class="position-relative p-3">
                    <img th:src="${medication.image != null ? medication.image : '/no-photo.jpg'}"
                         th:classappend="${!inStock} ? 'out-of-stock'"
                         class="img-fluid" style="max-height: 300px; object-fit: contain;" alt="Фото лекарства">
                    <span th:if="${!inStock}" class="out-of-stock-overlay">Нет в наличии</span>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card-body">
                    <div class="d-flex align-items-center gap-2 mb-2 flex-wrap">
                        <h3 class="fw-bold mb-0" th:text="${medication.name}"></h3>
                        <span th:if="${medication.prescriptionRequired}" class="badge bg-danger">Отпускается по рецепту</span>
                    </div>
                    <p class="text-muted" th:text="${medication.description}"></p>

<p class="fs-4 fw-bold text-primary"
                   th:text="'Цена: ' + ${#numbers.formatDecimal(medication.price, 1, 2)} + ' ₽'"></p>
                    <p th:if="${inStock}"
                       class="text-success fw-semibold">
                        В наличии: [[${availableQuantity}]] шт
                    </p>
                    <p th:unless="${inStock}"
                       class="text-secondary fw-semibold">
                        В настоящее время нет в наличии
                    </p>

                    <div class="mb-3">
                        <span class="fw-semibold">Лечит болезни:</span>
                        <span th:if="${medication.diseases.isEmpty()}">—</span>
                        <span th:each="d : ${medication.diseases}" th:text="${d.name} + ' '"></span>
                    </div>
                    <div class="mb-4">
                        <span class="fw-semibold">Действующие вещества:</span>
                        <span th:if="${medication.activeIngredients.isEmpty()}">—</span>
                        <span th:each="ai : ${medication.activeIngredients}" th:text="${ai.name} + ' '"></span>
                    </div>

                    <div class="d-flex gap-2 flex-wrap" sec:authorize="!hasRole('EMPLOYEE')">
                        <form th:if="${inStock}"
                              th:action="@{/cart/add/{id}(id=${medication.id})}" method="post" class="mb-0">
                            <button type="submit" class="btn btn-save px-4">В корзину</button>
                        </form>
                        <a th:unless="${inStock}"
                           th:href="@{/catalog/request}"
                           class="btn btn-cancel px-4">Оставить заявку на привоз</a>

                        <!-- Кнопка избранного -->
                        <form sec:authorize="hasRole('CUSTOMER')" th:unless="${isFavorite}"
                              th:action="@{/favorites/add/{id}(id=${medication.id})}" method="post" class="mb-0">
                            <button type="submit" class="btn btn-outline-danger px-4">
                                <i class="bi bi-heart"></i> В избранное
                            </button>
                        </form>
                        <form sec:authorize="hasRole('CUSTOMER')" th:if="${isFavorite}"
                              th:action="@{/favorites/remove/{id}(id=${medication.id})}" method="post" class="mb-0">
                            <button type="submit" class="btn btn-danger px-4">
                                <i class="bi bi-heart-fill"></i> В избранном
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- График изменения цены -->
    <div class="card shadow-sm mt-4" th:if="${priceHistory != null and !priceHistory.isEmpty()}">
        <div class="card-body">
            <h6 class="fw-bold mb-2">История изменения цены</h6>
            <canvas id="priceChart" height="80"></canvas>
        </div>
    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    (function () {
        var points = /*[[${priceHistory}]]*/ [];
        if (!points || points.length === 0) {
            return;
        }
        var labels = points.map(function (p) {
            return p.label;
        });
        var data = points.map(function (p) {
            return p.price;
        });

        var ctx = document.getElementById('priceChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Цена, ₽',
                    data: data,
                    borderColor: '#0b5ed7',
                    backgroundColor: 'rgba(11, 94, 215, 0.1)',
                    fill: true,
                    tension: 0.3,
                    pointRadius: 4
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    y: {
                        beginAtZero: false,
                        ticks: {
                            callback: function (value) { return value + ' ₽'; }
                        }
                    }
                }
            }
        });
    })();
    /*]]>*/
</script>

</body>
</html>
