<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/header :: head"></head>
<body>

<div th:replace="fragments/header :: body"></div>

<div class="container my-5 content">
    <a th:href="@{/catalog}" class="btn btn-cancel px-3 mb-4">← Назад в каталог</a>

    <div class="card shadow-sm">
        <div class="row g-0">
            <div class="col-md-4">
                <img th:src="${medication.image != null ? medication.image : '/no-photo.jpg'}"
                     class="img-fluid p-3" style="max-height: 300px; object-fit: contain;" alt="Фото лекарства">
            </div>
            <div class="col-md-8">
                <div class="card-body">
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <h3 class="fw-bold mb-0" th:text="${medication.name}"></h3>
                        <span th:if="${medication.prescriptionRequired}" class="badge bg-danger">Отпускается по рецепту</span>
                    </div>
                    <p class="text-muted" th:text="${medication.description}"></p>

                    <p class="fs-4 fw-bold text-primary"
                       th:text="'Цена: ' + ${#numbers.formatDecimal(medication.price, 1, 2)} + ' ₽'"></p>

                    <p th:if="${availableQuantity != null and availableQuantity > 0}"
                       class="text-success fw-semibold">
                        В наличии: [[${availableQuantity}]] шт
                    </p>
                    <p th:unless="${availableQuantity != null and availableQuantity > 0}"
                       class="text-secondary fw-semibold">
                        В настоящее время нет в наличии
                    </p>

                    <div class="mb-3">
                        <span class="fw-semibold">Лечит болезни:</span>
                        <span th:if="${medication.diseases.isEmpty()}">—</span>
                        <span th:each="d : ${medication.diseases}" th:text="${d.name} + ' '"></span>
                    </div>
                    <div class="mb-4">
                        <span class="fw-semibold">Действующие вещества:</span>
                        <span th:if="${medication.activeIngredients.isEmpty()}">—</span>
                        <span th:each="ai : ${medication.activeIngredients}" th:text="${ai.name} + ' '"></span>
                    </div>

                    <div class="d-flex gap-2" sec:authorize="!hasRole('EMPLOYEE')">
                        <a th:if="${availableQuantity != null and availableQuantity > 0}"
                           th:href="@{/catalog/order(medicationId=${medication.id})}"
                           class="btn btn-save px-4">Заказать на выкуп</a>
                        <a th:unless="${availableQuantity != null and availableQuantity > 0}"
                           th:href="@{/catalog/request}"
                           class="btn btn-cancel px-4">Оставить заявку на привоз</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
