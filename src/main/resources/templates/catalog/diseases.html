<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head"></head>
<body>

<div th:replace="fragments/header :: body"></div>

<div class="container my-5 content">
    <a th:href="@{/catalog}" class="btn btn-cancel px-3 mb-4">← Назад в каталог</a>
    <h3 class="fw-bold mb-4">Поиск лекарств по болезням</h3>

    <form th:action="@{/catalog/diseases}" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" name="name" th:value="${#strings.defaultString(currentName, '')}"
                   class="form-control" placeholder="Поиск по названию болезни...">
            <button type="submit" class="btn btn-outline-primary">Найти</button>
            <a th:href="@{/catalog/diseases}" class="btn btn-outline-primary">Сброс</a>
        </div>
    </form>

    <div class="list-group">
        <a th:each="d : ${diseasesPage}" th:href="@{/catalog/disease/{id}(id=${d.id})}"
           class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
            <div>
                <span class="fw-semibold" th:text="${d.name}"></span>
                <div class="small text-muted" th:text="${d.description}"></div>
            </div>
            <span class="bi bi-chevron-right"></span>
        </a>
    </div>

    <nav th:if="${diseasesPage != null and diseasesPage.totalPages > 1}" aria-label="Page navigation">
        <ul class="pagination justify-content-center mt-4">
            <li th:classappend="${diseasesPage.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/catalog/diseases(page=${diseasesPage.number - 1}, size=${diseasesPage.size}, name=${currentName})}">‹</a>
            </li>
            <li th:each="i : ${#numbers.sequence(0, diseasesPage.totalPages - 1)}"
                th:classappend="${i == diseasesPage.number} ? 'active'">
                <a class="page-link" th:text="${i + 1}"
                   th:href="@{/catalog/diseases(page=${i}, size=${diseasesPage.size}, name=${currentName})}"></a>
            </li>
            <li th:classappend="${diseasesPage.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/catalog/diseases(page=${diseasesPage.number + 1}, size=${diseasesPage.size}, name=${currentName})}">›</a>
            </li>
        </ul>
    </nav>
</div>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
