<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/header :: head"></head>
<body>

<div th:replace="fragments/header :: body"></div>

<div class="container my-5 content">
    <h3 class="fw-bold mb-4">Каталог лекарств</h3>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <!-- Поиск и фильтры -->
    <form th:action="@{/catalog}" method="get" class="mb-4">
        <div class="row g-2 align-items-end">
            <div class="col-md-4">
                <input type="text" name="name" th:value="${#strings.defaultString(currentName, '')}"
                       class="form-control" placeholder="Поиск по названию...">
            </div>
            <div class="col-md-3">
                <select name="inStock" class="form-select">
                    <option value="">Наличие: любые</option>
                    <option value="true" th:selected="${inStock == true}">Только в наличии</option>
                    <option value="false" th:selected="${inStock == false}">Нет в наличии</option>
                </select>
            </div>
            <div class="col-md-3">
                <select name="prescriptionRequired" class="form-select">
                    <option value="">Рецепт: любые</option>
                    <option value="false" th:selected="${prescriptionRequired == false}">Без рецепта</option>
                    <option value="true" th:selected="${prescriptionRequired == true}">По рецепту</option>
                </select>
            </div>
            <div class="col-md-2">
                <div class="input-group">
                    <input type="number" name="minPrice" step="0.01" th:value="${minPrice}"
                           class="form-control" placeholder="Цена от">
                    <input type="number" name="maxPrice" step="0.01" th:value="${maxPrice}"
                           class="form-control" placeholder="до">
                </div>
            </div>
            <div class="col-md-2">
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-outline-primary">Найти</button>
                    <a th:href="@{/catalog}" class="btn btn-outline-primary">Сброс</a>
                </div>
            </div>
        </div>
    </form>

    <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4 mb-5">
        <div class="col" th:each="med : ${medicationsPage}">
            <div class="card h-100 shadow-sm">
                <div class="position-relative">
                    <img th:src="${med.image != null ? med.image : '/no-photo.jpg'}"
                         th:classappend="${!med.inStock} ? 'out-of-stock'"
                         class="card-img-fixed" alt="Фото лекарства">
                    <span th:if="${!med.inStock}" class="out-of-stock-overlay">Нет в наличии</span>
                </div>
                <div class="card-body d-flex flex-column">
                    <div class="d-flex align-items-center gap-2">
                        <h6 class="fw-bold mb-0" th:text="${med.name}"></h6>
                        <span th:if="${med.prescriptionRequired}" class="badge bg-danger">По рецепту</span>
                    </div>
                    <p class="small text-muted mt-1" th:text="${med.description}"></p>

                    <!-- Рейтинг -->
                    <p class="mb-1">
                        <i class="bi bi-star-fill text-warning"></i>
                        <span th:text="${med.rating != null ? #numbers.formatDecimal(med.rating, 1, 1) : '—'}"></span>
                        <span class="text-muted"
                              th:text="'(' + ${med.reviewCount != null ? med.reviewCount : 0} + ' отзывов)'"></span>
                    </p>

                    <p class="fw-semibold mb-2" th:text="'Цена: ' + ${#numbers.formatDecimal(med.price, 1, 2)} + ' ₽'"></p>

                    <div th:if="${med.inStock}">
                        <span class="badge bg-success mb-2">В наличии: [[${med.availableQuantity}]] шт</span>
                    </div>
                    <div th:unless="${med.inStock}">
                        <span class="badge bg-secondary mb-2">Нет в наличии</span>
                    </div>

                    <div class="mt-auto d-flex gap-2 flex-wrap">
                        <a th:href="@{/catalog/medication/{id}(id=${med.id})}"
                           class="btn btn-edit px-3">Подробнее</a>
                        <form sec:authorize="hasRole('CUSTOMER')" th:if="${med.inStock}"
                              th:action="@{/cart/add/{id}(id=${med.id})}" method="post" class="mb-0">
                            <button type="submit" class="btn btn-save px-3">В корзину</button>
                        </form>
                        <a sec:authorize="hasRole('CUSTOMER')" th:unless="${med.inStock}"
                           th:href="@{/catalog/request}"
                           class="btn btn-cancel px-3">Заявка</a>
                        <a sec:authorize="!isAuthenticated()" th:href="@{/login}"
                           class="btn btn-cancel px-3">Войти</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <nav th:if="${medicationsPage != null and medicationsPage.totalPages > 1}" aria-label="Page navigation">
        <ul class="pagination justify-content-center mt-4">
            <li th:classappend="${medicationsPage.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/catalog(page=${medicationsPage.number - 1}, size=${medicationsPage.size},
                       name=${currentName}, inStock=${inStock}, prescriptionRequired=${prescriptionRequired},
                       minPrice=${minPrice}, maxPrice=${maxPrice})}">‹</a>
            </li>
            <li th:each="i : ${#numbers.sequence(0, medicationsPage.totalPages - 1)}"
                th:classappend="${i == medicationsPage.number} ? 'active'">
                <a class="page-link" th:text="${i + 1}"
                   th:href="@{/catalog(page=${i}, size=${medicationsPage.size},
                       name=${currentName}, inStock=${inStock}, prescriptionRequired=${prescriptionRequired},
                       minPrice=${minPrice}, maxPrice=${maxPrice})}"></a>
            </li>
            <li th:classappend="${medicationsPage.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/catalog(page=${medicationsPage.number + 1}, size=${medicationsPage.size},
                       name=${currentName}, inStock=${inStock}, prescriptionRequired=${prescriptionRequired},
                       minPrice=${minPrice}, maxPrice=${maxPrice})}">›</a>
            </li>
        </ul>
    </nav>
</div>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
