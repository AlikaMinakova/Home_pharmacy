<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head"></head>
<body>

<div th:replace="fragments/header :: body"></div>

<div class="container my-5 content">
    <h3 class="fw-bold mb-4">Cписок лекарств</h3>

    <form th:action="@{/medication}" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" name="name" th:value="${#strings.defaultString(currentName, '')}"
                   class="form-control" placeholder="Поиск по названию...">
            <button type="submit" class="btn btn-outline-primary">Найти</button>
            <a th:href="@{/medication}" class="btn btn-outline-primary">Сброс</a>
        </div>
    </form>

    <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4 mb-5">
        <div class="col" th:each="med : ${medicationsPage}">
            <div class="card h-100 shadow-sm">
                <img th:src="${med.image != null ? med.image : '/no-photo.jpg'}" class="card-img-fixed"
                     alt="Фото лекарства">
                <div class="card-body">
                    <div class="d-flex align-items-center gap-2">
                        <h6 class="fw-bold mb-0" th:text="${med.name}"></h6>
                        <span th:if="${med.prescriptionRequired}" class="badge bg-danger">По рецепту</span>
                    </div>
                    <p class="small text-muted mt-1" th:text="${med.description}"></p>
                    <p class="fw-semibold" th:if="${med.price != null}"
                       th:text="'Цена: ' + ${#numbers.formatDecimal(med.price, 1, 2)} + ' ₽'"></p>

                    <!-- Кнопки -->
                    <div class="d-flex gap-2">
                        <a th:href="@{/medication/{id}(id=${med.id})}"
                           class="btn btn-edit px-4">Редактировать</a>
                        <form th:action="@{/medication/{id}/delete(id=${med.id})}"
                              method="post" class="d-inline">
                            <button type="submit" class="btn btn-delete px-4">Удалить</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <nav th:if="${medicationsPage != null and medicationsPage.totalPages > 1}" aria-label="Page navigation">
        <ul class="pagination justify-content-center mt-4">
            <li th:classappend="${medicationsPage.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/medication(page=${medicationsPage.number - 1}, size=${medicationsPage.size}, name=${currentName})}">‹</a>
            </li>

            <li th:each="i : ${#numbers.sequence(0, medicationsPage.totalPages - 1)}"
                th:classappend="${i == medicationsPage.number} ? 'active'">
                <a class="page-link" th:text="${i + 1}"
                   th:href="@{/medication(page=${i}, size=${medicationsPage.size}, name=${currentName})}"></a>
            </li>

            <li th:classappend="${medicationsPage.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/medication(page=${medicationsPage.number + 1}, size=${medicationsPage.size}, name=${currentName})}">›</a>
            </li>
        </ul>
    </nav>
</div>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
