<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head"></head>
<body>

<div th:replace="fragments/header :: body"></div>

<div class="container my-5 content">
    <a th:href="@{/catalog}" class="btn btn-cancel px-3 mb-4">← В каталог</a>

    <h3 class="fw-bold mb-4">Мои заказы</h3>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <div th:if="${#maps.isEmpty(orders)}" class="alert alert-secondary">
        У вас пока нет заказов. <a th:href="@{/catalog}">Перейти в каталог</a>.
    </div>

    <div th:unless="${#maps.isEmpty(orders)}">
        <div class="card shadow-sm mb-4" th:each="group : ${orders}">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span class="fw-bold">Заказ №[[${group.value[group.value.size() - 1].id}]]</span>
                <span class="text-muted small"
                      th:text="'от ' + ${#temporals.format(group.value[0].createdAt, 'dd.MM.yyyy HH:mm')}
                              + ' · ' + ${group.value.size()} + ' поз.'"></span>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>Лекарство</th>
                            <th>Кол-во</th>
                            <th>Цена</th>
                            <th>Статус</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="order : ${group.value}">
                            <td th:text="${order.medication.name}"></td>
                            <td th:text="${order.quantity}"></td>
                            <td th:text="${#numbers.formatDecimal(order.medication.price, 1, 2)}"></td>
                            <td>
                                <span class="badge bg-warning text-dark" th:if="${order.status.name() == 'NEW'}">Новый</span>
                                <span class="badge bg-success" th:if="${order.status.name() == 'CONFIRMED'}">Подтверждён</span>
                                <span class="badge bg-info text-dark" th:if="${order.status.name() == 'PURCHASED'}">Выкуплен</span>
                                <span class="badge bg-secondary" th:if="${order.status.name() == 'REJECTED'}">Отклонён</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
