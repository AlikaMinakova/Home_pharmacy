<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head"></head>
<body>

<div th:replace="fragments/header :: body"></div>

<div class="container my-5 content">
    <a th:href="@{/catalog}" class="btn btn-cancel px-3 mb-4">← В каталог</a>

    <h3 class="fw-bold mb-4">Мои заказы</h3>

    <div th:if="${#lists.isEmpty(orders)}" class="alert alert-secondary">
        У вас пока нет заказов. <a th:href="@{/catalog}">Перейти в каталог</a>.
    </div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(orders)}">
        <table class="table table-hover align-middle shadow-sm">
            <thead class="table-light">
            <tr>
                <th>#</th>
                <th>Лекарство</th>
                <th>Кол-во</th>
                <th>Дата</th>
                <th>Статус</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.id}"></td>
                <td th:text="${order.medication.name}"></td>
                <td th:text="${order.quantity}"></td>
                <td th:text="${#temporals.format(order.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
                <td>
                    <span class="badge bg-warning text-dark" th:if="${order.status.name() == 'NEW'}">Новый</span>
                    <span class="badge bg-success" th:if="${order.status.name() == 'CONFIRMED'}">Подтверждён</span>
                    <span class="badge bg-info text-dark" th:if="${order.status.name() == 'PURCHASED'}">Выкуплен</span>
                    <span class="badge bg-secondary" th:if="${order.status.name() == 'REJECTED'}">Отклонён</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
