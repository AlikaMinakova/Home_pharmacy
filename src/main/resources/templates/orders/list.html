<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head"></head>
<body>

<div th:replace="fragments/header :: body"></div>

<div class="container my-5 content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0">Заказы покупателей</h3>
        <span class="badge bg-warning text-dark fs-6" th:if="${newCount > 0}">Новых: [[${newCount}]]</span>
    </div>

    <form th:action="@{/orders}" method="get" class="row g-2 align-items-end bg-light p-3 rounded mb-3">
        <div class="col-md-3">
            <label class="form-label small fw-semibold mb-1">Поиск</label>
            <input type="text" name="search" th:value="${#strings.defaultString(search, '')}"
                   class="form-control" placeholder="Имя, телефон, лекарство">
        </div>
        <div class="col-md-2">
            <label class="form-label small fw-semibold mb-1">Статус</label>
            <select name="status" class="form-select">
                <option value="">Все</option>
                <option value="NEW" th:selected="${status == 'NEW'}">Новый</option>
                <option value="CONFIRMED" th:selected="${status == 'CONFIRMED'}">Подтверждён</option>
                <option value="PURCHASED" th:selected="${status == 'PURCHASED'}">Выкуплен</option>
                <option value="REJECTED" th:selected="${status == 'REJECTED'}">Отклонён</option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label small fw-semibold mb-1">Сортировать по</label>
            <select name="sortBy" class="form-select">
                <option value="createdAt" th:selected="${sortBy == 'createdAt'}">Дата</option>
                <option value="medication" th:selected="${sortBy == 'medication'}">Лекарство</option>
                <option value="quantity" th:selected="${sortBy == 'quantity'}">Количество</option>
                <option value="customerName" th:selected="${sortBy == 'customerName'}">Имя покупателя</option>
                <option value="customerPhone" th:selected="${sortBy == 'customerPhone'}">Телефон</option>
                <option value="status" th:selected="${sortBy == 'status'}">Статус</option>
            </select>
        </div>
        <div class="col-md-2">
            <label class="form-label small fw-semibold mb-1">Направление</label>
            <select name="sortDir" class="form-select">
                <option value="desc" th:selected="${sortDir == 'desc'}">По убыванию</option>
                <option value="asc" th:selected="${sortDir == 'asc'}">По возрастанию</option>
            </select>
        </div>
        <div class="col-md-2 d-flex gap-2">
            <button type="submit" class="btn btn-save flex-fill">Применить</button>
            <a th:href="@{/orders}" class="btn btn-cancel">Сброс</a>
        </div>
    </form>

    <div th:if="${#lists.isEmpty(orders)}" class="alert alert-secondary">
        Заказы не найдены.
    </div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(orders)}">
        <table class="table table-hover align-middle shadow-sm">
            <thead class="table-light">
            <tr>
                <th>#</th>
                <th>Лекарство</th>
                <th>Кол-во</th>
                <th>Покупатель</th>
                <th>Телефон</th>
                <th>Дата</th>
                <th>Статус</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.id}"></td>
                <td th:text="${order.medication.name}"></td>
                <td th:text="${order.quantity}"></td>
                <td th:text="${order.customerName}"></td>
                <td th:text="${order.customerPhone}"></td>
                <td th:text="${#temporals.format(order.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
                <td>
                    <span class="badge bg-warning text-dark" th:if="${order.status.name() == 'NEW'}">Новый</span>
                    <span class="badge bg-success" th:if="${order.status.name() == 'CONFIRMED'}">Подтверждён</span>
                    <span class="badge bg-info text-dark" th:if="${order.status.name() == 'PURCHASED'}">Выкуплен</span>
                    <span class="badge bg-secondary" th:if="${order.status.name() == 'REJECTED'}">Отклонён</span>
                </td>
                <td>
                    <div class="d-flex gap-2" th:if="${order.status.name() == 'NEW'}">
                        <form th:action="@{/orders/{id}/confirm(id=${order.id})}" method="post">
                            <button type="submit" class="btn btn-leak px-3">Подтвердить</button>
                        </form>
                        <form th:action="@{/orders/{id}/reject(id=${order.id})}" method="post">
                            <button type="submit" class="btn btn-delete px-3">Отклонить</button>
                        </form>
                    </div>
                    <div class="d-flex gap-2" th:if="${order.status.name() == 'CONFIRMED'}">
                        <form th:action="@{/orders/{id}/purchase(id=${order.id})}" method="post">
                            <button type="submit" class="btn btn-leak px-3">Выкуплен</button>
                        </form>
                        <form th:action="@{/orders/{id}/cancel(id=${order.id})}" method="post">
                            <button type="submit" class="btn btn-delete px-3">Отменить</button>
                        </form>
                    </div>
                    <span th:if="${order.status.name() == 'PURCHASED' or order.status.name() == 'REJECTED'}"
                          class="text-muted small">—</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
