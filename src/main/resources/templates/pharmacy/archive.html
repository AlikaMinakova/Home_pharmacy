<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head"></head>
<body>

<div th:replace="fragments/header :: body"></div>

<div class="container my-5 content">
    <a th:href="@{/pharmacies}" class="btn btn-cancel px-3 mb-4">← Аптечка</a>

    <h3 class="fw-bold mb-1">История поступлений</h3>

    <form th:action="@{/pharmacies/archive}" method="get" class="row g-2 align-items-center mb-4">
        <div class="col-md-4">
            <input type="text" name="name" th:value="${#strings.defaultString(name, '')}"
                   class="form-control" placeholder="Поиск по названию лекарства...">
        </div>
        <div class="col-md-3">
            <select name="sort" class="form-select" onchange="this.form.submit()">
                <option value="purchaseDate" th:selected="${sort == 'purchaseDate'}">Дата покупки</option>
                <option value="name" th:selected="${sort == 'name'}">Название</option>
                <option value="expirationDate" th:selected="${sort == 'expirationDate'}">Срок годности</option>
            </select>
        </div>
        <div class="col-md-4 d-flex gap-2">
            <a class="btn btn-outline-primary px-3"
               th:href="@{/pharmacies/archive(name=${name}, sort=${sort}, dir=${dir == 'asc' ? 'desc' : 'asc'})}"
               th:title="'Направление сортировки'">
                <span th:text="${dir == 'asc' ? '▲' : '▼'}"></span>
            </a>
            <button type="submit" class="btn btn-save px-3">Найти</button>
            <a th:href="@{/pharmacies/archive}" class="btn btn-cancel px-3">Сброс</a>
        </div>
    </form>

    <div th:if="${history == null or #lists.isEmpty(history)}" class="alert alert-secondary">
        <span th:if="${#strings.isEmpty(name)}">
            История пуста. Добавьте поступление в разделе «Аптечка».
        </span>
        <span th:unless="${#strings.isEmpty(name)}">
            По заданному фильтру ничего не найдено.
        </span>
    </div>

    <div class="table-responsive" th:unless="${history == null or #lists.isEmpty(history)}">
        <table class="table table-hover align-middle shadow-sm">
            <thead class="table-light">
            <tr>
                <th>Лекарство</th>
                <th>Кол-во</th>
                <th>Цена</th>
                <th>Дата покупки</th>
                <th>Срок годности</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${history}">
                <td th:text="${item.medicationName}"></td>
                <td th:text="${item.quantity}"></td>
                <td th:text="${item.retailPrice != null ? #numbers.formatDecimal(item.retailPrice, 1, 2) + ' ₽' : '—'}"></td>
                <td th:text="${item.purchaseDate} ?: '—'"></td>
                <td th:text="${item.expirationDate}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
