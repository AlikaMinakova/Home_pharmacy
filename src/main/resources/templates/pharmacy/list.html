<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head"></head>
<body>

<div th:replace="fragments/header :: body"></div>

<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0">Склад</h3>
        <a th:href="@{/pharmacies/new}" class="btn btn-save px-4">+ Добавить поступление</a>
    </div>

    <!-- Истекает срок годности — самый верх -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0 text-dark">
            Истекает срок (≤ 7 дней)
        </h3>
        <a th:href="@{/pharmacies/expiring}" class="btn btn-save px-4">
            Посмотреть все
        </a>
    </div>

    <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4 mb-5">
        <div class="col" th:each="expiring : ${pharmacyPage.expiringSoon}">
            <div class="card h-100 shadow-sm">
                <div class="position-relative">
                    <img th:if="${expiring.medication.image != null}"
                         th:src="${expiring.medication.image}"
                         th:classappend="${expiring.quantity != null and expiring.quantity > 0} ? '' : 'out-of-stock'"
                         class="w-100"
                         style="height:130px; object-fit:contain; background:#fff; padding:8px;"
                         alt="лекарство">
                    <span th:if="${expiring.quantity == null or expiring.quantity <= 0}"
                          class="out-of-stock-overlay">Нет в наличии</span>
                </div>
                <div class="card-body">
                    <p th:if="${expiring.quantity != null and expiring.quantity > 0}"
                       class="text-success small fw-semibold">На складе</p>
                    <p th:unless="${expiring.quantity != null and expiring.quantity > 0}"
                       class="text-secondary small fw-semibold">Нет в наличии</p>
                    <h6 class="fw-bold">
                        <a th:href="@{/pharmacies/detail/{id}(id=${expiring.id})}"
                           th:text="${expiring.medication.name}"
                           class="text-decoration-none text-dark"></a>
                    </h6>
                    <ul class="list-unstyled small text-muted">
                        <li th:text="'Дата покупки: ' + ${expiring.purchaseDate}"></li>
                        <li th:text="'Срок годности: ' + ${expiring.expirationDate}"></li>
                        <li th:if="${expiring.quantity != null and expiring.quantity > 0}"
                            th:text="'Количество: ' + ${expiring.quantity} + ' шт'"></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4 gap-3 flex-wrap">
        <form th:action="@{/pharmacies}" method="get" class="d-flex gap-2 flex-grow-1" style="max-width: 480px;">
            <input type="text" name="keyword" th:value="${#strings.defaultString(keyword, '')}"
                   class="form-control" placeholder="Поиск по названию лекарства...">
            <input type="hidden" name="sort" th:value="${sort}">
            <button type="submit" class="btn btn-outline-primary">Найти</button>
            <a th:href="@{/pharmacies}" class="btn btn-outline-primary">Сброс</a>
        </form>

        <form th:action="@{/pharmacies}" method="get" class="d-flex align-items-center gap-2">
            <span class="fw-semibold">СОРТИРОВАТЬ:</span>
            <select name="sort" class="form-select w-auto" onchange="this.form.submit()">
                <option th:value="name" th:selected="${sort == 'name'}">По названию</option>
                <option th:value="quantity" th:selected="${sort == 'quantity'}">По количеству</option>
            </select>
            <input type="hidden" name="keyword" th:value="${keyword}">
        </form>
    </div>

    <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4 mb-5">
        <div class="col" th:each="stock : ${pharmacyPage.all}">
            <div class="card h-100 shadow-sm">
                <div class="position-relative">
                    <img th:src="${stock.image != null ? stock.image : '/no-photo.jpg'}"
                         th:classappend="${stock.totalQuantity != null and stock.totalQuantity > 0} ? '' : 'out-of-stock'"
                         class="card-img-fixed" alt="Фото лекарства">
                    <span th:if="${stock.totalQuantity == null or stock.totalQuantity <= 0}"
                          class="out-of-stock-overlay">Нет в наличии</span>
                </div>
                <div class="card-body">
                    <p th:if="${stock.totalQuantity != null and stock.totalQuantity > 0}"
                       class="text-success small fw-semibold">На складе</p>
                    <p th:unless="${stock.totalQuantity != null and stock.totalQuantity > 0}"
                       class="text-secondary small fw-semibold">Нет в наличии</p>
                    <h6 class="fw-bold">
                        <a th:href="@{/pharmacies/detail/{id}(id=${stock.batchId})}"
                           th:text="${stock.name}"
                           class="text-decoration-none text-dark"></a>
                    </h6>
                    <ul class="list-unstyled small text-muted">
                        <li th:text="'Цена: ' + ${#numbers.formatDecimal(stock.price, 1, 2)} + ' ₽'"></li>
                        <li th:if="${stock.totalQuantity != null and stock.totalQuantity > 0}"
                            th:text="'Всего на складе: ' + ${stock.totalQuantity} + ' шт'"></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <nav th:if="${pharmacyPage.all != null and pharmacyPage.all.totalPages > 1}" aria-label="Page navigation">
        <ul class="pagination justify-content-center mt-4">

            <li th:classappend="${pharmacyPage.all.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/pharmacies(page=${pharmacyPage.all.number - 1}, size=${pharmacyPage.all.size}, keyword=${keyword}, sort=${sort})}">‹</a>
            </li>

            <li th:if="${pharmacyPage.all.number > 2}">
                <a class="page-link"
                   th:href="@{/pharmacies(page=0, size=${pharmacyPage.all.size}, keyword=${keyword}, sort=${sort})}">1</a>
            </li>
            <li th:if="${pharmacyPage.all.number > 3}">
                <span class="page-link">...</span>
            </li>

            <li th:each="i : ${#numbers.sequence(pharmacyPage.all.number-2 > 0 ? pharmacyPage.all.number-2 : 0,
                                             pharmacyPage.all.number+2 < pharmacyPage.all.totalPages-1 ? pharmacyPage.all.number+2 : pharmacyPage.all.totalPages-1)}"
                th:classappend="${i == pharmacyPage.all.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/pharmacies(page=${i}, size=${pharmacyPage.all.size}, keyword=${keyword}, sort=${sort})}"
                   th:text="${i+1}"></a>
            </li>

            <li th:if="${pharmacyPage.all.number < pharmacyPage.all.totalPages-4}">
                <span class="page-link">...</span>
            </li>

            <li th:if="${pharmacyPage.all.number < pharmacyPage.all.totalPages-3}">
                <a class="page-link"
                   th:href="@{/pharmacies(page=${pharmacyPage.all.totalPages-1}, size=${pharmacyPage.all.size}, keyword=${keyword}, sort=${sort})}"
                   th:text="${pharmacyPage.all.totalPages}"></a>
            </li>

            <li th:classappend="${pharmacyPage.all.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/pharmacies(page=${pharmacyPage.all.number + 1}, size=${pharmacyPage.all.size}, keyword=${keyword}, sort=${sort})}">›</a>
            </li>

        </ul>
    </nav>
</div>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
